name: Archive validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate archive JSON
        run: |
          python -m json.tool archive/portfolio.json >/dev/null
          python -m json.tool archive/github-repositories.json >/dev/null
      - name: Reject common private artifacts
        run: bash scripts/check-public-boundary.sh
